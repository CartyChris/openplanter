name: Frontend CI

on:
  push:
    branches:
      - "v0/repair-graph-build"
  pull_request:
    branches:
      - main
      - v0/openplanter-36c03735
    paths:
      - "openplanter-desktop/frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - "api/**"
      - "server/**"
      - "package*.json"
      - "tsconfig.server.json"
      - "vercel.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openplanter-desktop/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: openplanter-desktop/frontend/package-lock.json
      - name: Validate server
        working-directory: .
        run: npm ci && npm run check:server && npm run test:server
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install mobile browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Portrait mobile smoke tests
        run: npx playwright test e2e/mobile.spec.ts --config e2e/playwright.config.ts
